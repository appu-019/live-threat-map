<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>live-threat-map</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg id="map" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid slice">
  <g id="countries"></g>
  <g id="arcs"></g>
  <g id="sensor"></g>
</svg>

<header>
  <h1>live-threat-map</h1>
  <p id="summary">loading…</p>
</header>

<aside id="feed">
  <h2>recent</h2>
  <ol id="rows"></ol>
</aside>

<aside id="countries-panel">
  <h2>by country</h2>
  <table id="by-country"></table>
</aside>

<footer id="credits"></footer>

<!-- data is loaded with script tags rather than fetch() so the page also works from file:// -->
<script src="data/world.js"></script>
<script src="data/attacks.js"></script>
<script src="app.js"></script>
</body>
</html>
